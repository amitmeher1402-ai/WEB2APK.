<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web2APK</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Web2APK</h1>

        <p>Turn your website into an Android app</p>

        <input
            type="url"
            id="websiteUrl"
            placeholder="Enter website URL"
        >

        <input
            type="text"
            id="appName"
            placeholder="Enter app name"
        >

        <button onclick="generateAPK()">
            Generate APK
        </button>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
